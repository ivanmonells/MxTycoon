      }
      this.S = S;
      const fin = this.features.find(f => f.type === 'finish');
      this.finishS = fin && closed ? U.mod(fin.s + 1, this.length) : null;
      const st = this.features.find(f => f.type === 'start');
      this.startS = st && closed ? U.mod(st.s, this.length) : null;
      /* lips and jump tables */
      this._buildLips();
      this.wear = new Float32Array(Math.max(1, Math.ceil(this.length / 5)));
      this._computeEntry(world);
      if (this.pieces) for (const f of this.features) { const i = this.sIndex(f.s); f.ax = S.x[i]; f.az = S.z[i]; }
    }

    _placeFeatureSamples(S) {
      const n = S.n;
      for (let fi = 0; fi < this.features.length; fi++) {
        const f = this.features[fi];
        const sh = getShape(f.type);
        if (!sh) continue;
        const len = f.len || sh.len;
        const i0 = Math.round(f.s / DS);
        const cnt = Math.max(1, Math.round(len / DS));
        let ksum = 0;
        for (let k = 0; k <= cnt; k++) {
          const i = S.closed ? U.mod(i0 + k, n) : i0 + k;
          if (i < 0 || i >= n) continue;
          S.feat[i] = fi;
          const u = k * DS;
          if (sh.fn) S.prof[i] += sh.fn(u);
          if (sh.noLip) S.noLip[i] = 1;
          ksum += S.curv[i];
        }
        if (sh.kind === 'berm') {
          const side = f.side || (ksum > 0 ? -1 : 1);
          f.side = side;
          for (let k = 0; k <= cnt; k++) {
            const i = S.closed ? U.mod(i0 + k, n) : i0 + k;
            if (i < 0 || i >= n) continue;
            const u = k * DS;
            const ramp = U.smoothstep(0, 3, u) * U.smoothstep(0, 3, len - u);
            S.berm[i] = Math.max(S.berm[i], sh.bermH * ramp);
            S.bermSide[i] = side;
          }
        }
      }
    }

    /* Ballistic tables: for each lip, outcome of a takeoff at each speed. */
    _buildLips() {
      const S = this.S;
      this.lips = [];
      if (!S) return;
      S.lipAt.fill(-1);
      for (let fi = 0; fi < this.features.length; fi++) {
        const f = this.features[fi];
        const sh = getShape(f.type);
        if (!sh || !sh.lips.length) continue;
        for (const lp of sh.lips) {
          let s = f.s + lp.u;
          if (S.closed) s = U.mod(s, S.L);
          const i = Math.round(s / DS);
          if (i < 0 || i >= S.n) continue;
          const lip = { i, s: i * DS, slope: Math.max(0.15, S.slope[U.clamp(i - 2, 0, S.n - 1)]), feat: fi, type: f.type };
          lip.maxLand = (sh.len - lp.u) + 4;
          lip.table = this._jumpTable(lip);
          S.lipAt[i] = this.lips.length;
          this.lips.push(lip);
        }
      }
    }
    groundY(s) {
      const S = this.S;
      let f = s / DS;
      if (S.closed) f = U.mod(f, S.n);
      else f = U.clamp(f, 0, S.n - 1.001);
      const i = Math.floor(f), t = f - i;
      const j = S.closed ? (i + 1) % S.n : Math.min(S.n - 1, i + 1);
      return S.y[i] + (S.y[j] - S.y[i]) * t;
    }
    slopeAt(s) {
      const S = this.S;
      let i = Math.round(s / DS);
      i = S.closed ? U.mod(i, S.n) : U.clamp(i, 0, S.n - 1);
      return S.slope[i];
    }
    simulateFlight(s0, y0, v, vz0, out) {
      const g = C.G, dt = 1 / 120;
      let s = s0, y = y0, vz = vz0, t = 0;
      while (t < 5) {
        s += v * dt; y += vz * dt; vz -= g * dt; t += dt;
        const gy = this.groundY(s);
        if (t > 0.04 && y <= gy) {
          const sl = this.slopeAt(s);
          out.landS = s; out.air = t; out.impact = Math.abs((vz - v * sl) / Math.sqrt(1 + sl * sl));
          out.vzLand = vz; out.peak = Math.max(out.peak || 0, 0);
          return out;
        }
      }
      out.landS = s; out.air = t; out.impact = 99; out.vzLand = vz;
      return out;
    }
    _jumpTable(lip) {
      const y0 = this.S.y[lip.i];
      const res = [];
      const tmp = {};
      for (let v = 2; v <= 32.01; v += 0.25) {
        this.simulateFlight(lip.s, y0, v, v * lip.slope, tmp);
        let kind;
        const landD = tmp.landS - lip.s;
        if (tmp.air < 0.24) kind = 'hop';
        else if (landD > lip.maxLand) kind = 'over';
        else if (tmp.impact < Track.LAND_CLEAN) kind = 'clean';
        else if (tmp.impact < Track.LAND_HARD) kind = 'hard';
        else kind = 'crash';
        res.push({ v, kind, air: tmp.air, impact: tmp.impact, land: landD });
      }
      let vRollMax = 2;
      for (const r of res) { if (r.kind === 'hop' || r.kind === 'clean') vRollMax = r.v; else break; }
      const options = [];
      let cur = null;
      for (const r of res) {
        if (r.kind === 'clean' && r.air >= 0.4) {
          if (!cur) cur = { vMin: r.v, vMax: r.v, air: r.air, land: r.land, sumImp: r.impact, cnt: 1 };
          else { cur.vMax = r.v; cur.air = Math.max(cur.air, r.air); cur.land = r.land; cur.sumImp += r.impact; cur.cnt++; }
        } else if (cur) { options.push(cur); cur = null; }
      }
      if (cur) options.push(cur);
      for (let k = options.length - 1; k >= 0; k--) {
        const o = options[k];
        if (o.vMax - o.vMin < 0.24 || o.vMax < Track.GLUE_SPEED + 0.5) options.splice(k, 1);
      }
      for (const o of options) {
        const width = o.vMax - o.vMin + 0.25;
        const below = res.find(r => r.v >= o.vMin - 0.6 && r.v < o.vMin);
        const gapBelow = below && (below.kind === 'crash');
        o.mid = (o.vMin + o.vMax) / 2;
        o.req = U.clamp(Math.round(8 + o.air * 14 + 16 / (width + 1.2) + (gapBelow ? 18 : 0) + Math.max(0, o.mid - 10) * 1.2), 5, 100);
        o.gap = !!gapBelow;
      }
      options.sort((a, b) => b.air - a.air);
      const big = options.length ? options[0] : null;
      return { vRollMax, options, res, maxAir: big ? big.air : 0, req: big ? big.req : 0 };
    }

    _computeEntry(world) {
      const S = this.S;
      this.entry = null;
      if (!S) return;
      const st = this.features.find(f => f.type === 'start') || this.features.find(f => f.type === 'finish');
      let s = st ? st.s + (st.type === 'start' ? 2 : 0) : 0;
      let i = S.closed ? U.mod(Math.round(s / DS), S.n) : U.clamp(Math.round(s / DS), 0, S.n - 1);
      const hdg = S.hdg[i], nx = -Math.sin(hdg), nz = Math.cos(hdg);
      /* prefer the outer side of the loop (away from the centroid) so the entry is reachable */
      let mx = 0, mz = 0;
      for (let k = 0; k < S.n; k += 8) { mx += S.x[k]; mz += S.z[k]; }
      const cnt = Math.ceil(S.n / 8); mx /= cnt; mz /= cnt;
      const outer = ((S.x[i] + nx - mx) ** 2 + (S.z[i] + nz - mz) ** 2) > ((S.x[i] - nx - mx) ** 2 + (S.z[i] - nz - mz) ** 2) ? 1 : -1;
      let best = null;
      for (const side of [outer, -outer]) {
        for (const extra of [3.5, 5.5, 8]) {
          const off = S.w[i] * 0.5 + extra;
          const x = S.x[i] + nx * off * side, z = S.z[i] + nz * off * side;
          const tx = Math.floor(x / C.TILE), tz = Math.floor(z / C.TILE);
          if (!world.inBounds(tx, tz)) continue;
          const id = world.idx(tx, tz);
          if (world.bld[id] >= 0 || world.isWater(tx, tz) || (world.trackOcc[id] & ~this.bit)) continue;
          if (!best) best = { x, z, tx, tz, s: i * DS, side, i };
          break;
        }
        if (best) break;
      }
      this.entry = best;
    }

    /* ---------- queries ---------- */
    wrapS(s) { return this.S && this.S.closed ? U.mod(s, this.S.L) : U.clamp(s, 0, this.length); }
    sIndex(s) {
      const S = this.S;
      const i = Math.round(s / DS);
      return S.closed ? U.mod(i, S.n) : U.clamp(i, 0, S.n - 1);
    }
    /* Interpolated pose at distance s and lateral offset lane (positive = left normal). */
    poseAt(s, lane, out) {
      const S = this.S;
      let f = s / DS;
      if (S.closed) f = U.mod(f, S.n); else f = U.clamp(f, 0, S.n - 1.001);
      const i = Math.floor(f), t = f - i;
      const j = S.closed ? (i + 1) % S.n : Math.min(S.n - 1, i + 1);
      const hdg = U.angleLerp(S.hdg[i], S.hdg[j], t);
      const nx = -Math.sin(hdg), nz = Math.cos(hdg);
      out = out || {};
      out.x = S.x[i] + (S.x[j] - S.x[i]) * t + nx * lane;
      out.z = S.z[i] + (S.z[j] - S.z[i]) * t + nz * lane;
      out.hdg = hdg;
      out.y = S.y[i] + (S.y[j] - S.y[i]) * t + this.bankAt(i, lane);
      out.yRide = S.yRide[i] + (S.yRide[j] - S.yRide[i]) * t + this.bankAt(i, lane);
      out.i = i;
      return out;
    }
    bankAt(i, lane) {
      const S = this.S;
      const bh = S.berm[i];
      if (bh <= 0) return 0;
      const hw = S.w[i] * 0.5;
      const q = U.clamp((lane * S.bermSide[i] / hw + 1) * 0.5, 0, 1);
      return bh * q * q;
    }
    nearestS(x, z, hint, range) {
      const S = this.S;
      if (!S) return null;
      let best = Infinity, bi = 0;
      let i0 = 0, i1 = S.n;
      if (hint != null && range) {
        const c = Math.round(hint / DS), r = Math.round(range / DS);
        i0 = c - r; i1 = c + r;
      }
      for (let k = i0; k < i1; k += 1) {
        const i = S.closed ? U.mod(k, S.n) : U.clamp(k, 0, S.n - 1);
        const d = U.dist2(x, z, S.x[i], S.z[i]);
        if (d < best) { best = d; bi = i; }
      }
      const hdg = S.hdg[bi];
      const lane = (x - S.x[bi]) * -Math.sin(hdg) + (z - S.z[bi]) * Math.cos(hdg);
      return { s: bi * DS, i: bi, dist: Math.sqrt(best), lane };
    }

    /* ---------- features ---------- */
    featureLen(type, s) {
      const sh = getShape(type);
      if (!sh) return 0;
      if (sh.kind === 'berm') return this._bermRange(s) ? this._bermRange(s).len : 0;
      return sh.len;
    }
    _bermRange(s) {
      const S = this.S;
      if (!S) return null;
      const thr = 1 / 45;
      const ic = this.sIndex(s);
      if (Math.abs(S.curv[ic]) < thr) return null;
      const sign = Math.sign(S.curv[ic]);
      let a = 0, b = 0;
      const maxK = Math.round(32 / DS);
      while (a < maxK) { const i = this.sIndex((ic - a - 1) * DS); if (Math.abs(S.curv[i]) < thr * 0.8 || Math.sign(S.curv[i]) !== sign) break; a++; }
      while (b < maxK) { const i = this.sIndex((ic + b + 1) * DS); if (Math.abs(S.curv[i]) < thr * 0.8 || Math.sign(S.curv[i]) !== sign) break; b++; }
      const s0 = this.wrapS((ic - a) * DS - 3);
      const len = Math.min(64, (a + b) * DS + 6);
      return { s0, len, side: sign > 0 ? -1 : 1 };
    }
    /* Check a feature placement; returns {ok, reason, s0, len, side}. */
    checkFeature(type, s, ignoreUid, fixed) {
      const S = this.S;
      const d = Cat.features[type];
      if (!S || !this.closed) return { ok: false, reason: 'Cierra el trazado primero' };
      if (!d) return { ok: false, reason: 'Elemento desconocido' };
      let s0 = Math.round(s), len = fixed ? fixed.len : this.featureLen(type, s), side = 0;
      if (fixed) s0 = fixed.s;
      if (d.kind === 'berm') {
        if (fixed) {
          const mid = this.sIndex(fixed.s + fixed.len / 2);
          if (Math.abs(S.curv[mid]) < 1 / 70) return { ok: false, reason: 'El peralte ya no está en una curva', s0, len };
          side = fixed.side;
        } else {
          const r = this._bermRange(s);
          if (!r) return { ok: false, reason: 'El peralte va en una curva', s0, len: 0 };
          s0 = r.s0; len = r.len; side = r.side;
        }
      }
      if ((d.kind === 'start' || d.kind === 'finish') && this.features.some(f => f.type === type && f.uid !== ignoreUid))
        return { ok: false, reason: 'Solo puede haber una ' + (d.kind === 'start' ? 'parrilla' : 'meta'), s0, len };
      if (len > S.L * 0.4) return { ok: false, reason: 'El circuito es demasiado corto para este elemento', s0, len };
      /* curvature restrictions */
      const needStraight = d.kind !== 'berm' && d.kind !== 'finish' && !(fixed && fixed.pin != null);
      if (needStraight) {
        const lim = d.kind === 'start' ? 1 / 40 : (d.kind === 'bumps' ? 1 / 22 : 1 / 30);
        const from = d.kind === 'start' ? s0 - 6 : s0, to = d.kind === 'start' ? s0 + len + 22 : s0 + len;
        for (let q = from; q <= to; q += 1) {
          if (Math.abs(S.curv[this.sIndex(q)]) > lim)
            return { ok: false, reason: d.kind === 'start' ? 'La parrilla necesita una recta larga' : 'Este elemento debe ir en una recta', s0, len };
        }
      }
      /* overlap with other features */
      for (const f of this.features) {
        if (f.uid === ignoreUid) continue;
        const flen = f.len || this.featureLen(f.type, f.s);
        if (this._overlap(s0 - 1.5, len + 3, f.s, flen)) return { ok: false, reason: 'Se solapa con ' + Cat.features[f.type].name.toLowerCase(), s0, len };
      }
      return { ok: true, s0, len, side };
    }
    _overlap(a0, alen, b0, blen) {
      const L = this.S.L;
      const segs = (s0, l) => {
        s0 = U.mod(s0, L);
        if (s0 + l <= L) return [[s0, s0 + l]];
        return [[s0, L], [0, s0 + l - L]];
      };
      for (const [x0, x1] of segs(a0, alen)) for (const [y0, y1] of segs(b0, blen)) if (x0 < y1 && y0 < x1) return true;
      return false;
    }
    addFeature(type, s0, len, side) {
      const S = this.S;
      const i = this.sIndex(s0);
      const f = { uid: this.nextFeatUid++, type, s: this.wrapS(s0), len, ax: S.x[i], az: S.z[i], side: side || 0 };
      this.features.push(f);
      return f;
    }
    removeFeature(uid) {
      const k = this.features.findIndex(f => f.uid === uid);
      if (k >= 0) return this.features.splice(k, 1)[0];
      return null;
    }
    featureAt(s) {
      for (const f of this.features) {
        const flen = f.len || this.featureLen(f.type, f.s);
        if (this._overlap(s, 0.01, f.s, Math.max(flen, 3))) return f;
      }
      return null;
    }
    /* After node edits, keep features attached to their world anchors. */
    reanchorFeatures(world, oldLen) {
      if (!this.S) return;
      for (const f of this.features) {
        const hint = oldLen > 0 ? f.s * this.length / oldLen : f.s;
        const r = this.nearestS(f.ax, f.az, hint, Math.max(30, this.length * 0.25)) || this.nearestS(f.ax, f.az);
        if (r) f.s = r.s;
        if (Cat.features[f.type].kind === 'berm') {
          const br = this._bermRange(f.s + (f.len || 0) / 2);
          if (br) { f.s = br.s0; f.len = br.len; f.side = br.side; }
        }
      }
      this.rebuild(world);
      for (const f of this.features) { const i = this.sIndex(f.s); f.ax = this.S.x[i]; f.az = this.S.z[i]; }
    }

    /* ---------- piece construction ---------- */
    pinFeature(type, pin, off) {
      const sh = getShape(type);
      const f = { uid: this.nextFeatUid++, type, pin, off, s: off, len: sh ? sh.len : 0, ax: 0, az: 0, side: 0 };
      this.features.push(f);
      return f;
    }
    pieceIndexAt(s) {
      if (!this.pieces || !this.S) return -1;
      return this.S.seg[this.sIndex(s)];
    }
    /* Try the start straight at lattice (x, z) facing h without building it. */
    probeStart(world, x, z, h, w, surf) {
      const tmp = Track.probeTrack(x, z, h, 0, { t: 'start', slope: 0, bank: 0, w, surf }, this.slot);
      tmp.rebuild(world);
      const res = { ok: true, tmp, g: tmp.pieces[0]._g, cost: 0, reason: '' };
      const why = this._probeTiles(world, tmp);
      if (why) { res.ok = false; res.reason = why; }
      else if (!Track.roomBehind(world, x, z, h, w, this.bit)) res.warn = 'Deja sitio detrás: el circuito tiene que volver a la salida por ahí';
      res.cost = this._probeCost(world, tmp);
      return res;
    }
    /* Try the next piece without building it: geometry, cost and the first problem found. */
    probePiece(world, p) {
      if (!this.pieces || !this.origin || !this.pieces.length) return { ok: false, reason: 'Coloca primero la parrilla de salida' };
      if (this.closed) return { ok: false, reason: 'El circuito ya está cerrado' };
      if (!this.endPose) this.rebuild(world);
      const e = this.endPose;
      const tmp = Track.probeTrack(e.x, e.z, e.h, e.e, p, this.slot);
      tmp.rebuild(world);
      const g = tmp.pieces[0]._g;
      const res = { ok: true, tmp, g, closes: false, cost: 0, reason: '' };
      const fail = (r) => { res.ok = false; res.reason = r; res.cost = this._probeCost(world, tmp); return res; };
      if (g.e1 < -0.01) return fail('No se puede bajar más: la pista ya va a ras de suelo');
      if (g.e1 > ELEV_MAX + 0.01) return fail('Demasiado alto: máximo ' + ELEV_MAX + ' m sobre el terreno');
      if (this.length + g.len > C.MAX_TRACK_LEN) return fail('El circuito sería demasiado largo');
      const o = this.origin;
      if (g.x1 === o.x && g.z1 === o.z) {
        if (g.h1 !== o.h) return fail('Llegas a la salida en otra dirección');
        if (Math.abs(g.e1 - (this.e0 || 0)) > 0.01) return fail('Llegas a la salida a otra altura: baja al nivel de la parrilla');
        res.closes = true;
      }
      const why = this._probeTiles(world, tmp);
      if (why) return fail(why);
      if (this._probeOverlap(tmp, res.closes)) return fail('Choca con el propio circuito');
      res.cost = this._probeCost(world, tmp);
      return res;
    }
    _probeTiles(world, tmp) {
      const S = tmp.S;
      for (let i = 0; i < S.n; i += 2) {
        const tx = Math.floor(S.x[i] / C.TILE), tz = Math.floor(S.z[i] / C.TILE);
        if (!world.inBounds(tx, tz)) return 'Fuera del mapa';
      }
      tmp.computeFootprint(world);
      let r = null;
      for (const t of tmp.tiles) {
        const tx = t % world.N, tz = (t / world.N) | 0;
        if (world.owned[t] !== 1) return 'Fuera de tu terreno';
        if (r) continue;
        if (world.bld[t] >= 0) r = 'Hay un edificio en medio';
        else if (world.path[t]) r = 'Hay un camino o una carretera en medio';
        else if (world.isWater(tx, tz)) r = 'No se puede construir sobre el agua';
        else if (world.trackOcc[t] & ~this.bit) r = 'Choca con otro circuito';
      }
      return r;
    }
    _probeOverlap(tmp, closes) {
      const S = this.S, T2 = tmp.S;
      if (!S) return false;
      const L = this.length, Ln = tmp.length;
      for (let i = 0; i < T2.n; i += 2) {
        const sn = i * DS;
        for (let j = 0; j < S.n; j += 2) {
          const sj = j * DS;
          const minD = (T2.w[i] + S.w[j]) * 0.5 + 0.8;
          let arc = (L - sj) + sn;
          if (closes) arc = Math.min(arc, (Ln - sn) + sj);
          if (arc < minD * 2.2 + 4) continue;
          if (U.dist2(T2.x[i], T2.z[i], S.x[j], S.z[j]) < minD * minD) return true;
        }
      }
      return false;
    }
    _probeCost(world, tmp) {
      if (!tmp.tiles.length) tmp.computeFootprint(world);
      let trees = 0;
      for (const t of tmp.tiles) {
        if ((world.trackOcc[t] & this.bit) || world.owned[t] !== 1 || world.scen[t] < 0) continue;
        if (world.isTree(world.scenery.get(world.scen[t]))) trees++;
      }
      return Math.round(tmp.geometryCost() + tmp.featureCost() + trees * C.TREE_CLEAR_COST);
    }

    /* ---------- footprint, cost, validation ---------- */
    computeFootprint(world) {
      const S = this.S;
      const set = new Set();
      if (!S) { this.tiles = []; return this.tiles; }
      for (let i = 0; i < S.n; i += 2) {
        const hdg = S.hdg[i], nx = -Math.sin(hdg), nz = Math.cos(hdg);
        const hw = S.w[i] * 0.5;
        for (const side of [-1, 1]) {
          const ex = S.x[i] + nx * hw * side, ez = S.z[i] + nz * hw * side;
          const eh = S.y[i] + this.bankAt(i, hw * side) - world.heightAt(ex, ez);
          const ext = 0.9 + U.clamp(eh * 1.25, 0, 7);
          for (let o = 0; o <= hw + ext; o += 0.9) {
            const x = S.x[i] + nx * o * side, z = S.z[i] + nz * o * side;
            const tx = Math.floor(x / C.TILE), tz = Math.floor(z / C.TILE);
            if (tx >= 0 && tz >= 0 && tx < world.N && tz < world.N) set.add(tx + tz * world.N);
          }
        }
      }
      this.tiles = Array.from(set);
      return this.tiles;
    }
    applyOccupancy(world) {
      const bit = this.bit;
      for (let i = 0; i < world.trackOcc.length; i++) if (world.trackOcc[i] & bit) world.trackOcc[i] &= ~bit;
      for (const t of this.tiles) world.trackOcc[t] |= bit;
    }
    clearOccupancy(world) {
      const bit = this.bit;
      for (let i = 0; i < world.trackOcc.length; i++) if (world.trackOcc[i] & bit) world.trackOcc[i] &= ~bit;
    }
    geometryCost() {
      const S = this.S;
      if (!S) return 0;
      let c = 0;
      for (let i = 0; i < S.n; i++) {
        const sd = Cat.surfaces[Cat.surfaceOrder[S.surf[i]]];
        c += DS * sd.cost * (S.w[i] / 8) + DS * S.w[i] * Math.max(0, S.elev[i]) * 6;
      }
      return Math.round(c);
    }
    featureCost() {
      let c = 0;
      for (const f of this.features) c += Cat.features[f.type].cost;
      return c;
    }

    /* Returns list of {level:'error'|'warn', msg, x, z}. Facility checks are done by Game. */
    validate(world) {
      const issues = [];
      const S = this.S;
      const at = (i) => ({ x: S.x[i], z: S.z[i] });
      if (!S || !this.closed || (!this.pieces && this.nodes.length < 4)) {
        issues.push({ level: 'error', msg: this.pieces ? 'El circuito no está cerrado: sigue construyendo hasta volver a la salida.' : 'El trazado no está cerrado (mínimo 4 puntos).' });
        this.issues = issues; this.valid = false; return issues;
      }
      S.bad.fill(0);
      if (this.length < C.MIN_TRACK_LEN) issues.push({ level: 'error', msg: 'Demasiado corto: ' + Math.round(this.length) + ' m (mínimo ' + C.MIN_TRACK_LEN + ' m).' });
      if (this.length > C.MAX_TRACK_LEN) issues.push({ level: 'error', msg: 'Demasiado largo: máximo ' + C.MAX_TRACK_LEN + ' m.' });
      /* radius */
      let radiusBad = -1;
      for (let i = 0; i < S.n; i++) if (Math.abs(S.curv[i]) > 1 / C.MIN_RADIUS) { S.bad[i] = 1; if (radiusBad < 0) radiusBad = i; }
      if (radiusBad >= 0) issues.push(Object.assign({ level: 'error', msg: 'Hay una curva imposible (radio menor de ' + C.MIN_RADIUS + ' m).' }, at(radiusBad)));
      /* slope of the base (features excluded) */
      let slopeBad = -1;
      for (let i = 0; i < S.n; i++) {
        const a = this.sIndex((i - 2) * DS), b = this.sIndex((i + 2) * DS);
        const sl = (S.base[b] - S.base[a]) / (4 * DS);
        if (Math.abs(sl) > C.MAX_SLOPE) { S.bad[i] = 1; if (slopeBad < 0) slopeBad = i; }
      }
      if (slopeBad >= 0) issues.push(Object.assign({ level: 'error', msg: 'Pendiente excesiva en el trazado.' }, at(slopeBad)));
      /* self overlap via spatial hash */
      const cell = 4, grid = new Map();
      for (let i = 0; i < S.n; i += 2) {
        const k = Math.floor(S.x[i] / cell) + ',' + Math.floor(S.z[i] / cell);
        if (!grid.has(k)) grid.set(k, []);
        grid.get(k).push(i);
      }
      let overlapAt = -1;
      for (let i = 0; i < S.n; i += 2) {
        const cx = Math.floor(S.x[i] / cell), cz = Math.floor(S.z[i] / cell);
        const reach = Math.ceil((S.w[i] + 2) / cell);
        for (let dz = -reach; dz <= reach && !S.bad[i]; dz++) for (let dx = -reach; dx <= reach; dx++) {
          const list = grid.get((cx + dx) + ',' + (cz + dz));
          if (!list) continue;
          for (const j of list) {
            let arc = Math.abs(i - j) * DS;
            if (S.closed) arc = Math.min(arc, S.L - arc);
            const minD = (S.w[i] + S.w[j]) * 0.5 + 0.8;
            if (arc < minD * 2.2 + 4) continue;
            if (U.dist2(S.x[i], S.z[i], S.x[j], S.z[j]) < minD * minD) { S.bad[i] = 1; S.bad[j] = 1; if (overlapAt < 0) overlapAt = i; break; }
          }
        }
      }
      if (overlapAt >= 0) issues.push(Object.assign({ level: 'error', msg: 'El trazado se cruza o se pisa consigo mismo.' }, at(overlapAt)));
      /* footprint conflicts */
      this.computeFootprint(world);
      let notOwned = null, blocked = null, water = null, otherTrack = null;
      for (const t of this.tiles) {
        const tx = t % world.N, tz = (t / world.N) | 0;
        const c = { x: (tx + 0.5) * C.TILE, z: (tz + 0.5) * C.TILE };
        if (world.owned[t] !== 1) { notOwned = notOwned || c; continue; }
        if (world.bld[t] >= 0 || world.path[t]) blocked = blocked || c;
        if (world.isWater(tx, tz)) water = water || c;
        if (world.trackOcc[t] & ~this.bit) otherTrack = otherTrack || c;
      }
      if (notOwned) issues.push(Object.assign({ level: 'error', msg: 'Parte del circuito está fuera de tu terreno.' }, notOwned));
      if (blocked) issues.push(Object.assign({ level: 'error', msg: 'El circuito pisa edificios o caminos.' }, blocked));
      if (water) issues.push(Object.assign({ level: 'error', msg: 'El circuito pasa por el agua.' }, water));
      if (otherTrack) issues.push(Object.assign({ level: 'error', msg: 'Se solapa con otro circuito.' }, otherTrack));
      /* features */
      const start = this.features.find(f => f.type === 'start');
      const finish = this.features.find(f => f.type === 'finish');
      if (!start) issues.push({ level: 'error', msg: 'Falta la parrilla de salida.' });
      if (!finish) issues.push({ level: 'error', msg: 'Falta la línea de meta.' });
      for (const f of this.features) {
        const r = this.checkFeature(f.type, f.s, f.uid, { s: f.s, len: f.len || this.featureLen(f.type, f.s), side: f.side, pin: f.pin });
        if (!r.ok) {
          const i = this.sIndex(f.s);
          issues.push(Object.assign({ level: 'error', msg: Cat.features[f.type].name + ': ' + r.reason.toLowerCase() + '.' }, at(i)));
          S.bad[i] = 1;
        }
      }
      if (!this.entry) issues.push({ level: 'error', msg: 'No hay sitio junto a la parrilla para la entrada de pilotos.' });
      const jumps = this.features.filter(f => Cat.features[f.type].group === 'jump').length;
      if (!jumps) issues.push({ level: 'warn', msg: 'Sin saltos: los pilotos se aburrirán.' });
      if (this.length < 400) issues.push({ level: 'warn', msg: 'Un circuito corto se satura con pocos pilotos.' });
      this.issues = issues;
      this.valid = !issues.some(i => i.level === 'error');
      return issues;
    }

    /* Surface share and simple descriptors used by the analyzer and UI. */
    describe() {
      const S = this.S;
      const d = { surf: [0, 0, 0, 0], avgW: 0, minW: 99, corners: 0, tight: 0, medium: 0, open: 0, straights: 0, longestStraight: 0, elevRange: 0, climb: 0, berms: 0 };
      if (!S) return d;
      let ymin = Infinity, ymax = -Infinity;
      for (let i = 0; i < S.n; i++) {
        d.surf[S.surf[i]] += 1 / S.n;
        d.avgW += S.w[i] / S.n; d.minW = Math.min(d.minW, S.w[i]);
        if (S.base[i] < ymin) ymin = S.base[i]; if (S.base[i] > ymax) ymax = S.base[i];
        if (i > 0 && S.base[i] > S.base[i - 1]) d.climb += S.base[i] - S.base[i - 1];
      }
      d.elevRange = ymax - ymin;
      /* corners: contiguous regions with |k| > 1/60 */
      let inC = false, peak = 0, straightRun = 0;
      for (let k = 0; k < S.n; k++) {
        const kk = Math.abs(S.curv[k]);
        if (kk > 1 / 60) {
          if (!inC) { inC = true; peak = 0; }
          peak = Math.max(peak, kk);
          if (straightRun * DS > 40) d.straights++;
          d.longestStraight = Math.max(d.longestStraight, straightRun * DS);
          straightRun = 0;
        } else {
          straightRun++;
          if (inC) {
            inC = false; d.corners++;
            const R = 1 / peak;
            if (R < 12) d.tight++; else if (R < 28) d.medium++; else d.open++;
          }
        }
      }
      d.longestStraight = Math.max(d.longestStraight, straightRun * DS);
      d.berms = this.features.filter(f => Cat.features[f.type].kind === 'berm').length;
      return d;
    }

    /* ---------- serialization ---------- */
    serialize() {
      return {
        id: this.id, name: this.name, slot: this.slot, closed: this.closed, state: this.state,
        nodes: this.nodes.map(n => [+n.x.toFixed(2), +n.z.toFixed(2), n.w, n.surf, n.elev]),
        pieces: this.pieces ? this.pieces.map(p => [p.t, p.t === 'curve' ? p.k : (p.n || 0), p.dir || 0, p.slope || 0, p.bank || 0, p.f || '', p.w, p.surf]) : null,
        origin: this.origin ? [this.origin.x, this.origin.z, this.origin.h] : null,
        features: this.features.map(f => [f.type, +f.s.toFixed(2), +(f.len || 0).toFixed(2), +f.ax.toFixed(2), +f.az.toFixed(2), f.side || 0, f.pin != null ? f.pin : -1, f.off || 0, f.auto || '']),
        paid: this.paid, featPaid: this.featPaid, records: this.records, totals: this.totals,
        moisture: this.moisture, statsTested: this.statsTested,
        wear: Array.from(this.wear, v => Math.round(v * 1000) / 1000)
      };
    }
    static deserialize(d, world) {
      const t = new Track(d.id, d.name);
      t.slot = d.slot; t.closed = d.closed; t.state = d.state;
      t.nodes = d.nodes.map(a => ({ x: a[0], z: a[1], w: a[2], surf: a[3], elev: a[4] || 0 }));
      if (d.pieces) {
        t.pieces = d.pieces.map(a => {
          const p = { t: a[0], slope: a[3] || 0, bank: a[4] || 0, w: a[6], surf: a[7] };
          if (a[0] === 'curve') { p.k = a[1]; p.dir = a[2]; } else if (a[0] === 'straight') p.n = a[1];
          if (a[5]) p.f = a[5];
          return p;
        });
        t.origin = d.origin ? { x: d.origin[0], z: d.origin[1], h: d.origin[2] } : null;
      }
      t.features = d.features.map(a => {
        const f = { uid: t.nextFeatUid++, type: a[0], s: a[1], len: a[2] || 0, ax: a[3], az: a[4], side: a[5] || 0 };
        if (a[6] != null && a[6] >= 0) { f.pin = a[6]; f.off = a[7] || 0; }
        if (a[8]) f.auto = a[8];
        return f;
      });
      t.paid = d.paid || 0; t.featPaid = d.featPaid || 0;
      t.records = d.records || t.records; t.totals = d.totals || t.totals;
      t.moisture = d.moisture || 0; t.statsTested = !!d.statsTested;
      t.rebuild(world);
      if (d.wear && d.wear.length === t.wear.length) t.wear.set(d.wear);
      t.computeFootprint(world);
      return t;
    }
  }

  /* A one-piece scratch track used to preview and check the next piece. */
  Track.probeTrack = function (x, z, h, e, p, slot) {
    const t = new Track(-1, 'tmp');
    t.slot = slot || 0;
    t.pieces = [Object.assign({}, p)];
    t.origin = { x, z, h }; t.e0 = e || 0;
    if (p.t === 'start') t.pinFeature('start', 0, START_GATE);
    else if (p.t === 'special') t.pinFeature(p.f, 0, SPECIAL_OFF);
    return t;
  };

  /* Shortest chain of pieces from the end of an open piece circuit back to its start
     pose (weighted A* on lattice poses). Obstacles and the existing track are

  const PANTS = [[40, 53, 147], [33, 33, 33], [93, 64, 55], [117, 117, 117], [55, 71, 79], [26, 35, 126], [197, 202, 233]];
  const TEAM = [[255, 106, 19], [230, 40, 40], [30, 110, 230], [250, 210, 30], [40, 170, 70], [245, 245, 245], [130, 50, 190], [20, 20, 20], [0, 180, 200]];

  function personName(rng) { return rng.pick(Cat.names.first) + ' ' + rng.pick(Cat.names.last); }

  /* ---------------- shared helpers ---------------- */
  function tileCenter(tx, tz) { return [tx * T + T / 2, tz * T + T / 2]; }
  function setWaypoint(a, tx, tz) {
    a.ntx = tx; a.ntz = tz;
    const c = tileCenter(tx, tz);
    a.px = c[0] + a.ox; a.pz = c[1] + a.oz;
  }
  function moveToward(a, speed, dt) {
    const dx = a.px - a.x, dz = a.pz - a.z;
    const d = Math.hypot(dx, dz);
    const step = speed * dt;
    if (d <= step || d < 0.01) { a.x = a.px; a.z = a.pz; return true; }
    a.x += dx / d * step; a.z += dz / d * step;
    a.yaw = U.angleLerp(a.yaw, Math.atan2(dz, dx), Math.min(1, dt * 10));
    a.walked = (a.walked || 0) + step;
    return false;
  }
  /* Follow a flow field one waypoint at a time. Returns 'moving' | 'arrived' | 'stuck'. */
  function followField(a, field, speed, dt, rng) {
    if (!field) return 'stuck';
    if (a.ntx == null) { a.ntx = a.tx; a.ntz = a.tz; setWaypoint(a, a.tx, a.tz); }
    if (moveToward(a, speed, dt)) {
      a.tx = a.ntx; a.tz = a.ntz;
      const d = field.get(a.tx, a.tz);
      if (d === 0) return 'arrived';
      if (d < 0) return 'stuck';
      const nxt = PF.nextStep(field, a.tx, a.tz, rng);
      if (nxt < 0) return 'stuck';
      setWaypoint(a, nxt % field.N, (nxt / field.N) | 0);
    }
    return 'moving';
  }

  class Thinker {
    think(g, key, force) {
      const def = Cat.thoughts[key];
      if (!def) return;
      const last = this._last || (this._last = {});
      if (!force && last[key] && g.time - last[key] < 40) return;
      last[key] = g.time;
      const text = def.t[Math.floor(Math.random() * def.t.length)];
      this.thoughts.unshift({ key, text, day: g.day });
      if (this.thoughts.length > 6) this.thoughts.pop();
      this.happy = U.clamp(this.happy + def.mood * 2.5, 0, 100);
      this.bubble = { key, text, t: 3.2 };
      g.recordThought(key, def.mood);
    }
  }

  /* ================================================================ */
  class Visitor extends Thinker {
    constructor(g, rng, opts) {
      super();

      this.kid = rng.chance(0.18);
      this.cols = [rng.pick(SHIRT), rng.pick(PANTS), rng.pick(HAIR), rng.pick(SKIN)];
      this.x = opts.x; this.z = opts.z; this.tx = opts.tx; this.tz = opts.tz; this.ntx = null;
      this.ox = rng.range(-1.1, 1.1); this.oz = rng.range(-1.1, 1.1);
      this.yaw = 0; this.y = 0;
      this.state = 'arrive';
      this.hunger = rng.range(0, 35); this.thirst = rng.range(0, 35); this.bladder = rng.range(0, 30); this.energy = rng.range(70, 100);
      this.happy = rng.range(58, 82); this.fun = 40;
      this.money = Math.round(rng.range(25, 90) * (opts.event ? 1.4 : 1));
      this.spent = 0; this.timeIn = 0; this.maxStay = rng.range(110, 260) * (opts.event ? 1.5 : 1);
      this.loveJumps = rng.range(0.4, 1.0); this.loveRace = rng.range(0.3, 1.0);
      this.thoughts = []; this.bubble = null;
      this.carId = opts.carId || null;

      this.litterT = 0;

      this.seat = null; this.inside = null;

    }
    update(g, dt, rng) {

      this.thirst = Math.min(100, this.thirst + dt * 0.32 * heat);
      this.bladder = Math.min(100, this.bladder + dt * 0.16);
      const seated = this.state === 'seat' || this.state === 'bench' || this.state === 'inside';
      this.energy = U.clamp(this.energy + dt * (seated ? 1.6 : -0.13), 0, 100);
      if (this.bladder > 88) this.happy = Math.max(0, this.happy - dt * 0.8);
      if (this.hunger > 90 || this.thirst > 92) this.happy = Math.max(0, this.happy - dt * 0.4);
      if (this.energy < 12) this.happy = Math.max(0, this.happy - dt * 0.3);
      if (g.raining() && !(this.inside || (this.seat && this.seat.covered))) {
        this.happy = Math.max(0, this.happy - dt * 0.25 * g.rainAmount());
        if (rng.chance(dt * 0.02)) this.think(g, 'rain');

      switch (this.state) {
        case 'arrive': return this.uArrive(g, dt, rng);
        case 'walk': return this.uWalk(g, dt, rng);
        case 'inside': return this.uInside(g, dt, rng);
        case 'watch': return this.uWatch(g, dt, rng);
        case 'seat': return this.uSeat(g, dt, rng);
        case 'bench': return this.uBench(g, dt, rng);

    speed() { return (this.kid ? 2.0 : 2.3) * (this.energy < 25 ? 0.8 : 1); }

        const price = this.event ? 0 : g.econ.prices.ticket;

    }
    /* choose the next activity */
    decide(g, rng) {

      const foodP = Math.round(7 * P.food), drinkP = Math.round(3 * P.food);
      if (this.bladder > 68) { if (this.goTo(g, 'toilet', rng)) return; this.think(g, 'no_toilet'); }
      if (this.hunger > 60 && this.money >= foodP) { if (this.goTo(g, 'food', rng)) { this.want = 'food'; return; } this.think(g, 'no_food'); }
      if (this.thirst > 56 && this.money >= drinkP) { if (this.goTo(g, 'food', rng)) { this.want = 'drink'; return; } this.think(g, 'thirsty'); }
      if (this.energy < 32) { if (this.goTo(g, 'seat', rng)) return; this.think(g, 'tired'); if (g.openTracks().length) this.think(g, 'no_seats'); }
      if (this.money > 24 * P.merch && this.happy > 55 && rng.chance(0.12)) { if (this.goTo(g, 'shop', rng)) return; }
      if (g.openTracks().length || g.race) {

      }

    }
    goTo(g, key, rng, quiet) {

    }

    }
    arrive(g, rng) {

        this.state = 'watch'; this.watchT = rng.range(18, 40); this.seen = 0;
        const t = g.nearestTrackPoint(this.x, this.z);
        if (t) this.yaw = Math.atan2(t.z - this.z, t.x - this.x);
        return;
      }
      if (key === 'seat') {
        const b = g.buildingAtDoor(this.tx, this.tz, ['grandstand', 'grandstand_cov', 'restaurant']);
        if (b && (b.type === 'grandstand' || b.type === 'grandstand_cov')) {

      }

      const b = types ? g.buildingAtDoor(this.tx, this.tz, types) : null;
      if (!b) { this.state = 'wander'; this.timer = 2; return; }
      if (key === 'food') {
        const drink = this.want === 'drink';
        const price = Math.round((drink ? 3 : 7) * P.food);
        if (this.money < price) { this.state = 'wander'; this.timer = 2; return; }
        if (P.food > 1.45 && rng.chance(0.5)) { this.think(g, 'expensive_food'); if (rng.chance(0.4)) { this.state = 'wander'; this.timer = 3; return; } }
        this.money -= price; this.spent += price;
        g.sale(b, 'comida', price, 0.38);

        else { this.hunger = Math.max(0, this.hunger - 75); this.thirst = Math.max(0, this.thirst - 15); this.litterT = rng.range(10, 35); }
        if (!drink && this.money >= Math.round(3 * P.food) && this.thirst > 30) {

      if (ex > 0.9 && rng.chance(dt * 0.25)) this.think(g, g.race ? 'love_race' : 'great_jump');
      if (ex < 0.05 && rng.chance(dt * 0.04)) this.think(g, g.ridersOnTracks() ? 'boring' : 'no_action');
      if (g.dustAt(this.x, this.z) > 0.6 && rng.chance(dt * 0.03)) this.think(g, 'dusty');
      this.cheer = ex > 0.9 || (g.race && ex > 0.4);

    }
    uSeat(g, dt, rng) {

      const ex = g.excitementAt(this.x, this.z) * 1.25;
      this.fun = U.clamp(this.fun + (ex * this.loveJumps - 0.1) * dt * 2.4, 0, 100);
      this.happy = U.clamp(this.happy + (ex - 0.08) * dt * 1.0, 0, 100);
      if (ex > 0.9 && rng.chance(dt * 0.2)) this.think(g, g.race ? 'love_race' : 'great_view');

          const nx = this.tx + dx, nz = this.tz + dz;

    satisfaction() { return U.clamp(this.happy * 0.65 + this.fun * 0.35, 0, 100); }

  }

  /* ================================================================ */
  function riderAttrs(rng, skill) {
    const j = (k) => U.clamp(Math.round(skill + rng.normal() * k), 3, 100);
    return { skill: j(8), speed: j(10), stamina: j(12), jump: j(10), aggr: U.clamp(rng.range(0.15, 0.95), 0, 1), exp: j(14), pop: U.clamp(Math.round(skill * 0.6 + rng.range(-10, 25)), 1, 100) };
  }
  function categoryOf(skill) {
    if (skill < 32) return 'principiante';
    if (skill < 56) return 'amateur';
    if (skill < 78) return 'experto';
    return 'pro';
  }
  const CAT_NAMES = { principiante: 'Principiante', amateur: 'Amateur', experto: 'Experto', pro: 'Profesional' };

  class Rider extends Thinker {
    constructor(g, rng, opts) {
      super();
      this.id = UID++; this.kind = 'rider';
      opts = opts || {};
      const skill = opts.skill != null ? opts.skill : 30;
      if (opts.profile) Object.assign(this, JSON.parse(JSON.stringify(opts.profile)), { id: this.id });
      else {
        this.name = opts.intl ? rng.pick(Cat.names.intlFirst) + ' ' + rng.pick(Cat.names.intlLast) : personName(rng);
        this.nick = rng.chance(0.25) ? rng.pick(Cat.names.nick) : '';
        this.attr = riderAttrs(rng, skill);
        const eligible = Cat.bikes.filter(b => this.attr.skill >= b.minSkill && this.attr.skill <= b.maxSkill);
        this.bikeId = (opts.bike || rng.pick(eligible.length ? eligible : Cat.bikes)).id;
        const team = rng.pick(TEAM);
        this.cols = [team, rng.pick([[30, 30, 30], [240, 240, 240], team, rng.pick(TEAM)]), rng.chance(0.5) ? team : rng.pick(TEAM), rng.pick(TEAM)];
        this.num = rng.int(2, 999);
        this.passHolder = false;
      }
      this.bike = Cat.bikes.find(b => b.id === this.bikeId) || Cat.bikes[2];
      this.cat = categoryOf(this.attr.skill);
      this.x = opts.x || 0; this.z = opts.z || 0; this.tx = opts.tx || 0; this.tz = opts.tz || 0; this.ntx = null;
      this.ox = rng.range(-1, 1); this.oz = rng.range(-1, 1);
      this.yaw = 0; this.y = 0;
      this.state = 'prep'; this.timer = rng.range(6, 12);
      this.happy = rng.range(60, 80); this.fun = 40;
      this.thoughts = []; this.bubble = null;
      this.m = null; this.trackId = null;
      this.lapsPlan = rng.int(3, 7); this.sessions = 0; this.maxSessions = rng.int(1, 3); this.feeOk = 40;
      this.bikeCond = rng.range(0.7, 1);
      this.vanId = opts.vanId || null;
      this.paddockId = opts.paddockId || null;
      this.race = opts.race || null;
      this.stats = { laps: 0, best: 0, crashes: 0, air: 0, clean: 0 };
      this.money = rng.range(40, 140);
      this.wantShower = false;
      this.injured = false;
      this.onFoot = false;
      this.walked = 0;
      this.stuckT = 0;
    }
    get displayName() { return this.name + (this.nick ? ' "' + this.nick + '"' : ''); }
    profile() {
      return { name: this.name, nick: this.nick, attr: this.attr, bikeId: this.bikeId, cols: this.cols, num: this.num, passHolder: this.passHolder, passMonths: this.passMonths || 0 };
    }
    update(g, dt, rng) {
      if (this.bubble) { this.bubble.t -= dt; if (this.bubble.t <= 0) this.bubble = null; }
      switch (this.state) {
        case 'prep': return this.uPrep(g, dt, rng);
        case 'toTrack': return this.uToTrack(g, dt, rng);

      this.satV = []; this.satR = [];
      this.prestige = 0;
      this.weather = 'sunny'; this.weatherDays = 0;
      this.unlocked = new Set();
      this.notes = [];
      this.thoughtStats = {};
      this.stats = this.freshDayStats();
      this.totals = { visitors: 0, riders: 0, laps: 0, crashes: 0, injuries: 0, events: 0 };
      this.history = [];
      this.fields = new Map();
      this.fieldsDirty = true; this.fieldsT = 0;
      this.rng = new U.RNG(12345);
      this.spawnAccV = 0; this.spawnAccR = 0;
      this.medicJobs = [];
      this.passHolders = [];
      this.selectedTrack = null;
      this.race = null;
      this.paused = false;
      this.gameOver = null;
      this.exciteGrid = null; this.dustGrid = null; this.gridT = 0;
      this.flags = { trainingDays: 0, visitorBoost: 0, visitorBoostDays: 0, merchBoost: 0, merchDays: 0, maintMul: 1, maintDays: 0 };
      this.marketing = [];
      this.sponsors = [];
      this.sponsorOffer = null;
      this.prog = null; this.comp = null; this.amb = null;
      this.lastCrashT = -99;
    }
    freshDayStats() { return { visitorsToday: 0, ridersToday: 0, ridersOnTrackToday: 0, lapsToday: 0, crashesToday: 0, refusedTicket: 0, refusedFee: 0, visitorsTotal: 0 }; }

    static create(opts) {
      const g = new Game();
      opts = opts || {};
      g.mode = opts.mode || 'career';
      g.seed = opts.seed || ((Math.random() * 1e9) | 0);
      g.parkName = opts.parkName || (U.rng.pick(Cat.names.parkPrefix) + ' ' + U.rng.pick(Cat.names.parkName));
      g.rng = new U.RNG(g.seed ^ 0xabcdef);
      g.world = new MX.World(C.MAP);
      g.world.generate(g.seed, opts.preset || 'valle');
      g.world.setupOwnership(g.mode);
      if (g.mode !== 'sandbox') g.world.setExpansionLevel(1);
      g.econ = new MX.Economy(g.mode === 'sandbox' ? C.SANDBOX_MONEY : C.START_MONEY);
      g.econ.maxLoan = g.mode === 'sandbox' ? 0 : 100000;
      if (g.mode === 'sandbox') g.rep = 300;
      g.prog = new MX.Progression(g);
      g.comp = new MX.Competition(g);
      g.amb = new MX.Ambient(g);
      g.econ.sampleCash(0);
      g.notify('Bienvenido a ' + g.parkName + '. ¡Construye tu primer circuito!', 'info');
      return g;
    }

    /* ---------------- calendar ---------------- */
    date(dayIndex) {
      const d = dayIndex != null ? dayIndex : this.day;
      const mIdx = C.START_MONTH + Math.floor(d / C.MONTH_DAYS);
      return { day: d % C.MONTH_DAYS + 1, month: mIdx % 12, year: 1 + Math.floor(mIdx / 12), dow: d % 7, monthIndex: Math.floor(d / C.MONTH_DAYS) };
    }
    dateText(dayIndex) {
      const t = this.date(dayIndex);
      return U.DAYS_SHORT[t.dow] + ' ' + t.day + ' ' + U.MONTHS_SHORT[t.month] + ', año ' + t.year;
    }
    isWeekend() { const d = this.date(); return d.dow >= 5; }
    seasonTint() {
      const m = this.date().month;
      return [0.05, 0, 0, 0, 0, 0.05, 0.15, 0.25, 0.32, 0.4, 0.3, 0.12][m];
    }

    /* ---------------- money ---------------- */
    canAfford(c) { return this.mode === 'sandbox' || c <= 0 || this.econ.money - c >= 0; }
    spend(cat, c, x, z) {
      if (c <= 0) return true;
      this.econ.spend(cat, c);
      if (x != null) MX.Bus.emit('money', { amount: -c, x, z });
      MX.Bus.emit('cash', { amount: -c });
      return true;
    }
    earn(cat, c, x, z, quiet) {
      if (!c) return;
      this.econ.earn(cat, c);
      if (x != null && !quiet) MX.Bus.emit('money', { amount: c, x, z });
    }
    sale(b, cat, price, costRatio) {
      this.econ.earn(cat, price);
      if (costRatio) this.econ.spend('suministros', Math.round(price * costRatio * 100) / 100);
      if (b) { b.rev = (b.rev || 0) + price; b.revTotal = (b.revTotal || 0) + price; b.customers = (b.customers || 0) + 1; }
      if (b && Math.random() < 0.15) MX.Bus.emit('money', { amount: price, x: b.cx, z: b.cz, small: true });
    }

    /* ---------------- notifications and thoughts ---------------- */
    notify(text, kind, opts) {
      const n = Object.assign({ text, kind: kind || 'info', day: this.day, t: this.time, id: U.rng.int(1, 1e9) }, opts || {});
      if (n.agent) { n.agentId = n.agent.id; n.agentKind = n.agent.kind; delete n.agent; }
      this.notes.unshift(n);
      if (this.notes.length > 80) this.notes.pop();
      MX.Bus.emit('notify', n);
      return n;
    }
    recordThought(key, mood) {
      const s = this.thoughtStats[key] || (this.thoughtStats[key] = { n: 0, mood });
      s.n += 1;
    }

    /* ---------------- unlocks ---------------- */
    isUnlocked(def) {
      if (!def || !def.unlock) return true;
      if (this.mode === 'sandbox') return true;
      return this.unlocked.has(def.unlock);
    }
    unlock(key) { this.unlocked.add(key); MX.Bus.emit('unlock', key); }
    wateringUnlocked() { return this.mode === 'sandbox' || this.unlocked.has('research:watering'); }
    get machineryBonus() { return this.mode === 'sandbox' || this.unlocked.has('research:machinery'); }

    /* ---------------- buildings ---------------- */
    rect(type, tx, tz, rot) {
      const d = Cat.buildings[type];
      const odd = rot % 2 === 1;
      return { tx, tz, w: odd ? d.h : d.w, h: odd ? d.w : d.h };
    }
    checkBuilding(type, tx, tz, rot) {
      const d = Cat.buildings[type];
      if (!d) return { ok: false, reason: 'Desconocido' };
      if (!this.isUnlocked(d)) return { ok: false, reason: 'Bloqueado: investiga o completa objetivos' };
      const r = this.rect(type, tx, tz, rot);
      const w = this.world;
      let trees = 0;
      for (let z = r.tz; z < r.tz + r.h; z++) for (let x = r.tx; x < r.tx + r.w; x++) {
        const why = w.canBuildOn(x, z, { clearScenery: true });
        if (why) return { ok: false, reason: why, rect: r };
        if (w.scen[w.idx(x, z)] >= 0) trees++;
      }
      const lv = w.footprintLevel(r.tx, r.tz, r.w, r.h);
      let mn = Infinity, mx = -Infinity;
      for (let vz = r.tz; vz <= r.tz + r.h; vz++) for (let vx = r.tx; vx <= r.tx + r.w; vx++) { const h = w.vh(vx, vz); mn = Math.min(mn, h); mx = Math.max(mx, h); }
      if (mx - mn > 3.2) return { ok: false, reason: 'Terreno demasiado irregular', rect: r };
      /* vertices shared with roads or other buildings stay put; the building keeps a plinth */
      lv.volume = 0;
      for (let vz = r.tz; vz <= r.tz + r.h; vz++) for (let vx = r.tx; vx <= r.tx + r.w; vx++) if (w.vertexEditable(vx, vz, 0xffff)) lv.volume += Math.abs(w.vh(vx, vz) - lv.target);
      const earth = Math.round(lv.volume * C.TERRAIN_COST * (this.machineryBonus ? 0.6 : 1));
      const cost = d.cost + earth + trees * C.TREE_CLEAR_COST;
      const warn = [];
      const acc = this.accessFor(type, r, rot);
      if (d.access === 'path' && !acc.path) warn.push('Necesita un camino junto a la entrada');
      if (d.access === 'road' && !acc.road) warn.push('Debe tocar una carretera');
      return { ok: true, cost, rect: r, level: lv.target, trees, warn };
    }
    accessFor(type, r, rot) {
      const w = this.world;
      let path = false, road = false;
      const fr = FRONT[rot || 0];
      void fr;
      const tiles = [];
      for (let x = r.tx; x < r.tx + r.w; x++) { tiles.push([x, r.tz - 1]); tiles.push([x, r.tz + r.h]); }
      for (let z = r.tz; z < r.tz + r.h; z++) { tiles.push([r.tx - 1, z]); tiles.push([r.tx + r.w, z]); }
      for (const [x, z] of tiles) {
        if (!w.inBounds(x, z)) continue;
        const p = w.path[w.idx(x, z)];
        if (p === P.GRAVEL || p === P.PAVED) path = true;
        if (p === P.ROAD) road = true;
      }
      return { path, road };
    }
    placeBuilding(type, tx, tz, rot, free) {
      const chk = this.checkBuilding(type, tx, tz, rot);
      if (!chk.ok) return chk;
      if (!free && !this.canAfford(chk.cost)) return { ok: false, reason: 'No tienes suficiente dinero', cost: chk.cost };
      const w = this.world, r = chk.rect;
      for (let z = r.tz; z < r.tz + r.h; z++) for (let x = r.tx; x < r.tx + r.w; x++) w.removeSceneryAt(x, z);
      w.flattenFootprint(r.tx, r.tz, r.w, r.h, chk.level, true);
      const b = {
        id: this.nextBld++, type, tx: r.tx, tz: r.tz, w: r.w, h: r.h, rot: rot || 0, y: chk.level,
        built: this.day, rev: 0, revTotal: 0, customers: 0, clean: 100, users: 0, cond: 100
      };
      this._finishBuilding(b);
      this.buildings.set(b.id, b);
      for (let z = r.tz; z < r.tz + r.h; z++) for (let x = r.tx; x < r.tx + r.w; x++) w.bld[w.idx(x, z)] = b.id;
      if (!free) this.spend('construccion', chk.cost, b.cx, b.cz);
      this.touchBuildings(b);
      this.fieldsDirty = true;
      MX.Bus.emit('build', { b });
      if (chk.warn && chk.warn.length) this.notify(Cat.buildings[type].name + ': ' + chk.warn[0].toLowerCase() + '.', 'warn', { x: b.cx, z: b.cz });
      return { ok: true, b, cost: chk.cost };
    }
    _finishBuilding(b) {
      const d = Cat.buildings[b.type];
      b.cx = (b.tx + b.w / 2) * T; b.cz = (b.tz + b.h / 2) * T;
      b.frontYaw = Math.atan2(FRONT[b.rot][1], FRONT[b.rot][0]);
      b.height = d.height;
      if (b.type === 'grandstand' || b.type === 'grandstand_cov') this._makeSeats(b);
      if (b.type === 'parking') this._makeSlots(b, 'car');
      if (b.type === 'paddock') this._makeSlots(b, 'van');
    }
    touchBuildings(b) {
      this.bldVer++;
      const CH = MX.Geom ? MX.Geom.CH : 16;
      const nC = Math.ceil(this.world.N / CH);
      this.bldDirtyChunks.add(Math.floor(b.tx / CH) + Math.floor(b.tz / CH) * nC);
    }
    _makeSeats(b) {
      const d = Cat.buildings[b.type];
      const rows = 4, cols = d.capacity / rows;
      b.seats = [];
      /* local frame: width along building x (W*4 m), rows going back from the front */
      const W = Cat.buildings[b.type].w * T, D = Cat.buildings[b.type].h * T;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const lx = (c + 0.5) * W / cols, lz = D - 0.6 - r * (D - 1.2) / rows;
        const ly = 0.45 + r * 0.62;
        const wp = this.localToWorld(b, lx, lz);
        b.seats.push({ x: wp.x, z: wp.z, y: b.y + ly, who: 0, yaw: b.frontYaw, covered: b.type === 'grandstand_cov', b: b.id });
      }
    }
    localToWorld(b, lx, lz) {
      /* local model frame: x in [0,w*T], z in [0,h*T] with front at +z, rotated by rot */
      const d = Cat.buildings[b.type];
      const W = d.w * T, D = d.h * T;
      const cx = lx - W / 2, cz = lz - D / 2;
      const a = -b.rot * Math.PI / 2;
      const c = Math.cos(a), s = Math.sin(a);
      return { x: b.cx + cx * c - cz * s, z: b.cz + cx * s + cz * c };
    }
    _makeSlots(b, kind) {
      b.slots = [];
      const x0 = b.tx * T, z0 = b.tz * T;
      if (kind === 'car') {
        for (let i = 0; i < 6; i++) {
          b.slots.push({ x: x0 + 1.1 + i * 1.96, z: z0 + 2.4, yaw: -Math.PI / 2, used: 0 });
          b.slots.push({ x: x0 + 1.1 + i * 1.96, z: z0 + 9.6, yaw: Math.PI / 2, used: 0 });
        }
      } else {
        for (let i = 0; i < 4; i++) {
          b.slots.push({ x: x0 + 1.6 + i * 2.9, z: z0 + 3.0, yaw: Math.PI / 2, used: 0 });
          b.slots.push({ x: x0 + 1.6 + i * 2.9, z: z0 + 9.0, yaw: -Math.PI / 2, used: 0 });
        }
      }
    }
    freeSlot(lotId, slot) { if (slot) slot.used = 0; void lotId; }
    removeBuilding(id, refund) {
      const b = this.buildings.get(id);
      if (!b) return false;
      const w = this.world;
      for (let z = b.tz; z < b.tz + b.h; z++) for (let x = b.tx; x < b.tx + b.w; x++) w.bld[w.idx(x, z)] = -1;
      this.buildings.delete(id);
      this.touchBuildings(b);
      this.fieldsDirty = true;
      const back = refund === false ? 0 : Math.round(Cat.buildings[b.type].cost * 0.4);
      if (back) this.econ.refund('construccion', back);
      /* evict agents that depended on it */
      for (const v of this.visitors) {
        if (v.inside === id) { v.inside = null; v.state = 'wander'; v.timer = 1; }
        if (v.seat && v.seat.b === id) { v.seat = null; v.state = 'wander'; v.timer = 1; }
      }
      for (const c of this.cars) if (c.lot === id) c.dead = true;
      for (const s of this.staff) if (s.home === id) s.home = null;
      MX.Bus.emit('demolish', { b });
      return true;
    }
    count(type) { let n = 0; for (const b of this.buildings.values()) if (b.type === type) n++; return n; }
    buildingsOf(type) { const out = []; for (const b of this.buildings.values()) if (b.type === type) out.push(b); return out; }
    doorTiles(b, kind) {
      /* kind 'path' -> adjacent path tiles; 'road' -> adjacent road tiles; 'open' -> adjacent rider-walkable tiles */
      const w = this.world;
      const out = [];
      const fr = FRONT[b.rot];
      const add = (x, z, front) => {
        if (!w.inBounds(x, z)) return;
        const i = w.idx(x, z);
        const p = w.path[i];
        let ok;
        if (kind === 'path') ok = p === P.GRAVEL || p === P.PAVED;
        else if (kind === 'road') ok = p === P.ROAD;
        else ok = this.riderPassable(x, z, i);
        if (ok) out.push({ tx: x, tz: z, i, front });
      };
      for (let x = b.tx; x < b.tx + b.w; x++) { add(x, b.tz - 1, fr[1] === -1); add(x, b.tz + b.h, fr[1] === 1); }
      for (let z = b.tz; z < b.tz + b.h; z++) { add(b.tx - 1, z, fr[0] === -1); add(b.tx + b.w, z, fr[0] === 1); }
      out.sort((a, c) => (c.front ? 1 : 0) - (a.front ? 1 : 0));
      return out;
    }
    doorWorldPos(b) {
      if (b._door && b._doorVer === this.fieldVer) return b._door;
      const t = this.doorTiles(b, 'open')[0] || this.doorTiles(b, 'path')[0];
      let res;
      if (t) { const c = A.tileCenter(t.tx, t.tz); res = { x: c[0], z: c[1], tx: t.tx, tz: t.tz }; }
      else {
        const fr = FRONT[b.rot];
        res = { x: b.cx + fr[0] * (b.w * T / 2 + 1), z: b.cz + fr[1] * (b.h * T / 2 + 1), tx: Math.floor(b.cx / T), tz: Math.floor(b.cz / T) };
      }
      b._door = res; b._doorVer = this.fieldVer;
      return res;
    }
    buildingAtDoor(tx, tz, types) {
      const w = this.world;
      for (const [dx, dz] of PF.DIRS) {
        const x = tx + dx, z = tz + dz;
        if (!w.inBounds(x, z)) continue;
        const id = w.bld[w.idx(x, z)];
        if (id < 0) continue;
        const b = this.buildings.get(id);
        if (b && types.includes(b.type)) return b;
      }
      return null;
    }
    nearestBuilding(types, x, z) {
      if (typeof types === 'string') types = [types];
      let best = null, bd = Infinity;
      for (const b of this.buildings.values()) {
        if (!types.includes(b.type)) continue;
        const d = U.dist2(x, z, b.cx, b.cz);
        if (d < bd) { bd = d; best = b; }
      }
      return best;
    }
    takeSeat(b, v) {
      if (!b.seats) return null;
      const free = b.seats.filter(s => !s.who);
      if (!free.length) return null;
      const s = free[Math.floor(Math.random() * free.length)];
      s.who = v.id;
      const d = this.doorTiles(b, 'path')[0];
      s.door = d ? [d.tx, d.tz] : null;
      v.x = s.x; v.z = s.z; v.yaw = s.yaw;
      return s;
    }
    freeSeat(s) { if (s) s.who = 0; }
    seatsTotal() { let n = 0; for (const b of this.buildings.values()) if (b.seats) n += b.seats.length; return n; }
    seatsCovered() { let n = 0; for (const b of this.buildings.values()) if (b.type === 'grandstand_cov') n += b.seats.length; return n; }

    /* ---------------- paths, decor, addons, terrain, land ---------------- */
    placePath(tx, tz, type) {
      const w = this.world;
      const why = w.canPlacePath(tx, tz, type);
      if (why) return { ok: false, reason: why };
      const cost = Cat.paths[type].cost + (w.scen[w.idx(tx, tz)] >= 0 ? C.TREE_CLEAR_COST : 0);
      if (!this.canAfford(cost)) return { ok: false, reason: 'No tienes suficiente dinero' };
      w.removeSceneryAt(tx, tz);
      w.setPath(tx, tz, type);
      this.spend('construccion', cost, (tx + 0.5) * T, (tz + 0.5) * T);
      this.fieldsDirty = true;
      return { ok: true, cost };
    }
    removePath(tx, tz) {
      const w = this.world;
      if (!w.inBounds(tx, tz) || tz === w.roadRow) return { ok: false, reason: 'No se puede quitar' };
      const i = w.idx(tx, tz);
      const p = w.path[i];
      if (!p) return { ok: false, reason: 'No hay camino' };
      w.setPath(tx, tz, 0);
      this.econ.refund('construccion', Math.round(Cat.paths[p].cost * 0.3));
      this.fieldsDirty = true;
      return { ok: true };
    }
    placeAddon(tx, tz, kind) {
      const w = this.world;
      if (!w.isWalkable(tx, tz)) return { ok: false, reason: 'Va sobre un camino peatonal' };
      const id = { bench: 1, bin: 2, lamp: 3 }[kind];
      const i = w.idx(tx, tz);
      if (w.addon[i] === id) return { ok: false, reason: 'Ya hay uno' };
      const cost = Cat.addons[kind].cost;
      if (!this.canAfford(cost)) return { ok: false, reason: 'No tienes suficiente dinero' };
      w.addon[i] = id; w.addonVer++;
      this.spend('construccion', cost, (tx + 0.5) * T, (tz + 0.5) * T);
      this.fieldsDirty = true;
      return { ok: true, cost };
    }
    placeDecor(type, tx, tz, rot) {
      const w = this.world;
      const d = Cat.decor[type];
      if (!d) return { ok: false, reason: 'Desconocido' };
      if (!w.inBounds(tx, tz)) return { ok: false, reason: 'Fuera del mapa' };
      const i = w.idx(tx, tz);
      if (!w.owned[i]) return { ok: false, reason: 'Terreno no comprado' };
      if (w.bld[i] >= 0 || w.path[i] || w.trackOcc[i]) return { ok: false, reason: 'Ocupado' };
      if (w.isWater(tx, tz)) return { ok: false, reason: 'Hay agua' };
      if (w.scen[i] >= 0) return { ok: false, reason: 'Ya hay algo aquí' };
      if (!this.canAfford(d.cost)) return { ok: false, reason: 'No tienes suficiente dinero' };
      const sp = d.banner && this.sponsors.length ? this.sponsors[this.rng.int(0, this.sponsors.length - 1)].id : null;
      w.addScenery(type, tx, tz, this.rng, { rot: rot != null ? rot : undefined, sponsor: sp });
      this.spend('construccion', d.cost, (tx + 0.5) * T, (tz + 0.5) * T);
      for (const tr of this.tracks) tr.statsStale = true;
      return { ok: true, cost: d.cost };
    }
    removeScenery(tx, tz) {
      const w = this.world;
      const o = w.sceneryAt(tx, tz);
      if (!o) return { ok: false, reason: 'No hay nada' };
      const natural = w.isTree(o);
      const cost = natural ? C.TREE_CLEAR_COST : 0;
      if (cost && !this.canAfford(cost)) return { ok: false, reason: 'No tienes suficiente dinero' };
      w.removeSceneryAt(tx, tz);
      if (cost) this.spend('terreno', cost, (tx + 0.5) * T, (tz + 0.5) * T);
      else if (Cat.decor[o.type]) this.econ.refund('construccion', Math.round(Cat.decor[o.type].cost * 0.3));
      return { ok: true, cost };
    }
    terrainEdit(op, tx0, tz0, tx1, tz1, opts) {
      opts = opts || {};
      let block = 0;
      for (const tr of this.tracks) if (tr.state === 'open' || tr.state === 'testing') block |= tr.bit;
      const res = this.world.terrainEdit(op, tx0, tz0, tx1, tz1, Object.assign({ blockTrack: block }, opts));
      if (!res.changed) return { ok: false, reason: 'No se puede modificar aquí', cost: 0 };
      const cost = Math.max(10, Math.round(res.cost * C.TERRAIN_COST * (this.machineryBonus ? 0.6 : 1)));
      if (!this.canAfford(cost)) { this.world.undoTerrain(res.undo); return { ok: false, reason: 'No tienes suficiente dinero', cost }; }
      this.spend('terreno', cost, (tx0 + tx1 + 1) * T / 2, (tz0 + tz1 + 1) * T / 2);
      /* trees and tracks follow the new ground */
      this.world.sceneryVer++;
      for (const tr of this.tracks) {
        if (!tr.S) continue;
        const touch = tr.tiles.some(t => { const x = t % this.world.N, z = (t / this.world.N) | 0; return x >= tx0 - 2 && x <= tx1 + 2 && z >= tz0 - 2 && z <= tz1 + 2; });
        if (touch) this.trackGeometryChanged(tr, false);
      }
      for (const b of this.buildings.values()) {
        if (b.tx + b.w >= tx0 - 1 && b.tx <= tx1 + 1 && b.tz + b.h >= tz0 - 1 && b.tz <= tz1 + 1) this.touchBuildings(b);
      }
      this.fieldsDirty = true;
      return { ok: true, cost };
    }
    paintGround(tx0, tz0, tx1, tz1, type) {
      let n = 0;
      for (let z = tz0; z <= tz1; z++) for (let x = tx0; x <= tx1; x++) if (this.world.paintGround(x, z, type)) n++;
      if (!n) return { ok: false, reason: 'Nada que pintar' };
      const cost = n * C.PAINT_COST;
      this.spend('terreno', cost);
      return { ok: true, cost };
    }
    buyParcel(px, pz) {
      const w = this.world;
      if (w.parcelState(px, pz) !== 1) return { ok: false, reason: w.parcelState(px, pz) === 2 ? 'Ya es tuyo' : 'Aún no está a la venta' };
      const price = w.parcelPrice(px, pz);
      if (!this.canAfford(price)) return { ok: false, reason: 'No tienes suficiente dinero', cost: price };
      w.buyParcel(px, pz);
      this.spend('terreno', price, (px + 0.5) * C.PARCEL * T, (pz + 0.5) * C.PARCEL * T);
      this.notify('Has comprado una nueva parcela por ' + U.fmtMoney(price) + '.', 'money');
      MX.Bus.emit('land', { px, pz });
      return { ok: true, cost: price };
    }

    /* ---------------- tracks ---------------- */
    newTrack() {
      const used = new Set(this.tracks.map(t => t.slot));
      let slot = 0; while (used.has(slot) && slot < 15) slot++;
      if (used.has(slot)) return null;
      const tr = new MX.Track(null, 'Circuito ' + (this.tracks.length + 1));
      tr.slot = slot;
      tr.pieces = [];
      this.tracks.push(tr);
      this.selectedTrack = tr;
      MX.Bus.emit('track:list');
      return tr;
    }
    trackById(id) { for (const t of this.tracks) if (t.id === id) return t; return null; }
    openTracks() { return this._openCache || (this._openCache = this.tracks.filter(t => t.state === 'open')); }
    /* Apply a geometry edit atomically: fn mutates the track; cost delta charged or refunded. */
    editTrack(tr, fn, reanchor) {
      if (tr.state === 'open') return { ok: false, reason: 'Cierra el circuito para modificarlo' };
      if (tr.state === 'testing') this.endTest(tr);
      const snap = {
        nodes: tr.nodes.map(n => Object.assign({}, n)), features: tr.features.map(f => Object.assign({}, f)), closed: tr.closed,
        pieces: tr.pieces ? tr.pieces.map(p => Object.assign({}, p)) : null, origin: tr.origin ? Object.assign({}, tr.origin) : null
      };
      const oldLen = tr.length;
      const oldCost = tr.geometryCost() + tr.featureCost();
      const r = fn(tr);
      if (r && r.ok === false) return r;
      tr.rebuild(this.world);
      if (reanchor && tr.features.length) tr.reanchorFeatures(this.world, oldLen);
      const newCost = tr.geometryCost() + tr.featureCost();
      tr.computeFootprint(this.world);
      let trees = 0;
      for (const t of tr.tiles) if (this.world.scen[t] >= 0 && this.world.owned[t]) { const o = this.world.scenery.get(this.world.scen[t]); if (this.world.isTree(o)) trees++; }
      const delta = newCost - oldCost + trees * C.TREE_CLEAR_COST;
      if (delta > 0 && !this.canAfford(delta)) {
        tr.nodes = snap.nodes; tr.features = snap.features; tr.closed = snap.closed; tr.pieces = snap.pieces; tr.origin = snap.origin;
        tr.rebuild(this.world); tr.computeFootprint(this.world);
        return { ok: false, reason: 'No tienes suficiente dinero', cost: delta };
      }
      this.trackGeometryChanged(tr, true);
      if (delta > 0) this.spend('construccion', delta);
      /* undoing work on a circuit that never opened gives the money back in full */
      else if (delta < 0) this.econ.refund('construccion', Math.round(-delta * (tr.state === 'building' ? 1 : C.REFUND_RATE)));
      tr.paid = Math.max(0, tr.paid + delta);
      return { ok: true, cost: delta };
    }
    trackGeometryChanged(tr, clearTrees) {
      const w = this.world;
      if (!clearTrees) tr.rebuild(w);
      tr.computeFootprint(w);
      if (clearTrees) for (const t of tr.tiles) {
        if (w.owned[t] && w.scen[t] >= 0) { const o = w.scenery.get(w.scen[t]); if (w.isTree(o)) w.removeSceneryAt(t % w.N, (t / w.N) | 0); }
      }
      tr.applyOccupancy(w);
      if (tr.closed) tr.validate(w);
      tr.stats = null; tr.statsTested = false;
      tr.ver++;
      this.fieldsDirty = true;
      this._openCache = null;
      MX.Bus.emit('track:changed', { track: tr });
    }
    addFeature(tr, type, s) {
      const d = Cat.features[type];
      if (!this.isUnlocked(d)) return { ok: false, reason: 'Bloqueado: necesitas investigarlo' };
      const chk = tr.checkFeature(type, s);
      if (!chk.ok) return chk;
      if (!this.canAfford(d.cost)) return { ok: false, reason: 'No tienes suficiente dinero' };
      return this.editTrack(tr, (t) => { t.addFeature(type, chk.s0, chk.len, chk.side); });
    }
    removeFeature(tr, uid) {
      const f = tr.features.find(x => x.uid === uid);
      if (f && f.type === 'start' && tr.pieces) return { ok: false, reason: 'La parrilla forma parte del circuito: no se puede quitar' };
      return this.editTrack(tr, (t) => {
        const ff = t.features.find(x => x.uid === uid);
        if (!ff) return { ok: false, reason: 'No encontrado' };
        /* a jump piece becomes a plain straight; a banked curve loses its banking */
        if (ff.auto === 'bank') { for (let i = ff.pin; i < t.pieces.length && t.pieces[i].t === 'curve' && t.pieces[i].bank; i++) t.pieces[i].bank = 0; }
        else if (ff.pin != null && t.pieces && t.pieces[ff.pin] && t.pieces[ff.pin].t === 'special') {
          const pc = t.pieces[ff.pin];
          pc.n = pc._g ? pc._g.n : MX.Track.pieceUnits(pc, 0); pc.t = 'straight'; delete pc.f;
        }
        t.removeFeature(uid);
      });
    }

    /* ---------------- piece-by-piece construction ---------------- */
    placeStart(tr, x, z, h, w, surf) {
      if (!tr.pieces) return { ok: false, reason: 'Este circuito usa el trazado libre antiguo' };
      if (tr.pieces.length) return { ok: false, reason: 'La parrilla de salida ya está colocada' };
      const pr = tr.probeStart(this.world, x, z, h, w, surf);
      if (!pr.ok) return pr;
      if (!this.canAfford(pr.cost)) return { ok: false, reason: 'No tienes suficiente dinero' };
      return this.editTrack(tr, (t) => {
        t.origin = { x, z, h }; t.e0 = 0; t.closed = false;
        t.pieces = [{ t: 'start', slope: 0, bank: 0, w, surf }];
        t.features = [];
        t.pinFeature('start', 0, MX.Track.START_GATE);
      });
    }
    buildPiece(tr, p) {
      if (p.t === 'special' && !this.isUnlocked(Cat.features[p.f])) return { ok: false, reason: 'Bloqueado: necesitas investigarlo' };
      if (p.t === 'curve' && p.bank === 2 && !this.isUnlocked(Cat.features.berm_big)) return { ok: false, reason: 'El peralte grande necesita investigación' };
      if (!this.isUnlocked(Cat.surfaces[p.surf])) return { ok: false, reason: 'Superficie bloqueada: investígala' };
      const pr = tr.probePiece(this.world, p);
      if (!pr.ok) return pr;
      if (!this.canAfford(pr.cost)) return { ok: false, reason: 'No tienes suficiente dinero', cost: pr.cost };
      const r = this.editTrack(tr, (t) => {
        t.pieces.push(Object.assign({}, p));
        if (p.t === 'special') t.pinFeature(p.f, t.pieces.length - 1, MX.Track.SPECIAL_OFF);
        if (pr.closes) t.closed = true;
      });
      if (r.ok && pr.closes) { r.closes = true; MX.Bus.emit('track:closed-loop', { track: tr }); }
      return r;
    }
    removeLastPiece(tr) {
      if (!tr.pieces) return { ok: false, reason: 'Este circuito usa el trazado libre antiguo' };
      if (tr.pieces.length <= 1) return { ok: false, reason: 'La parrilla de salida no se quita: borra el circuito para empezar de nuevo' };
      return this.editTrack(tr, (t) => {
        const i = t.pieces.length - 1;
        const cut = t.pieces[i]._s0 != null ? t.pieces[i]._s0 : t.length;
        t.pieces.pop(); t.closed = false;
        t.features = t.features.filter(f => f.pin != null ? f.pin < i : (f.s >= 0 && f.s + (f.len || 0) <= cut - 0.5));
      });
    }
    /* Finish the loop automatically with the shortest free chain of pieces. */
    autoComplete(tr, w, surf) {
      if (!tr.pieces || !tr.pieces.length) return { ok: false, reason: 'Coloca primero la parrilla de salida' };
      if (tr.closed) return { ok: false, reason: 'El circuito ya está cerrado' };
      if (!tr.endPose) tr.rebuild(this.world);
      const plan = MX.Track.planClosure(this.world, tr, w, surf);
      if (!plan.ok) return plan;
      /* check the whole loop on a copy before touching the real one */
      const copy = MX.Track.deserialize(tr.serialize(), this.world);
      copy.pieces.push(...plan.pieces.map(p => Object.assign({}, p)));
      copy.closed = true;
      copy.rebuild(this.world);
      const geomErr = copy.validate(this.world).find(i => i.level === 'error' && /cruza|terreno|edificios|agua|otro circuito|Pendiente|imposible|largo/.test(i.msg));
      if (geomErr) return { ok: false, reason: 'No encuentro un cierre limpio: ' + geomErr.msg.toLowerCase() };
      const r = this.editTrack(tr, (t) => { for (const p of plan.pieces) t.pieces.push(Object.assign({}, p)); t.closed = true; });
      if (r.ok) { r.closes = true; r.added = plan.pieces.length; MX.Bus.emit('track:closed-loop', { track: tr }); }
      return r;
    }
    /* Rounded-rectangle loop with a few elements inside rect {x0, z0, w, h} (tiles). */
    suggestLoop(tr, rect, w, surf) {
      if (!tr.pieces) return { ok: false, reason: 'Este circuito usa el trazado libre antiguo' };
      const m = Math.ceil((w * 0.5 + 2.5) / C.TILE);
      const startU = MX.Track.pieceUnits({ t: 'start' }, 0);
      let k = 2, a = rect.w - 2 * m - 6 * k - startU, b = rect.h - 2 * m - 6 * k;
      if (a < 0 || b < 2) { k = 1; a = rect.w - 2 * m - 6 * k - startU; b = rect.h - 2 * m - 6 * k; }
      if (a < 0 || b < 2) return { ok: false, reason: 'No hay sitio para un circuito: deja libre al menos ' + (startU + 6 + 2 * m) + ' x ' + (8 + 2 * m) + ' casillas' };
      const P = (o) => Object.assign({ slope: 0, bank: 0, w, surf }, o);
      const unlocked = (f) => this.isUnlocked(Cat.features[f]);
      const leg = (units, specials) => {
        const out = [];
        for (const f of specials) {
          if (!unlocked(f)) continue;
          const u = MX.Track.pieceUnits({ t: 'special', f }, 0);
          if (u <= units) { out.push(P({ t: 'special', f })); units -= u; }
        }
        while (units > 0) { const n = Math.min(6, units); out.push(P({ t: 'straight', n })); units -= n; }
        return out;
      };
      const turn = (bank) => [P({ t: 'curve', k, dir: 1, bank }), P({ t: 'curve', k, dir: 1, bank })];
      const pieces = [P({ t: 'start' })]
        .concat(leg(a, ['tabletop_m']), turn(1), leg(b, ['rollers', 'tabletop_s']), turn(0), leg(startU + a, ['finish', 'tabletop_s', 'whoops']), turn(1), leg(b, ['whoops']), turn(0));
      const ox = rect.x0 + m + 3 * k, oz = rect.z0 + m;
      let x = ox, z = oz, h = 0;
      for (const p of pieces) { const g = MX.Track.pieceGeom(p, x, z, h, 0); x = g.x1; z = g.z1; h = g.h1; }
      if (x !== ox || z !== oz || h !== 0) return { ok: false, reason: 'No se pudo cerrar el trazado sugerido' };
      return this.editTrack(tr, (t) => {
        t.origin = { x: ox, z: oz, h: 0 }; t.e0 = 0; t.closed = true;
        t.pieces = pieces; t.features = [];
        pieces.forEach((p, i) => {
          if (p.t === 'start') t.pinFeature('start', i, MX.Track.START_GATE);
          else if (p.t === 'special') t.pinFeature(p.f, i, MX.Track.SPECIAL_OFF);
        });
      });
    }
    validateTrack(tr) {
      const issues = tr.validate(this.world).slice();
      const pads = this.buildingsOf('paddock');
      if (!pads.length) issues.push({ level: 'error', msg: 'Construye un paddock: es la base de los pilotos.' });
      else if (!pads.some(b => this.doorTiles(b, 'road').length)) issues.push({ level: 'error', msg: 'El paddock debe tocar una carretera para que lleguen las furgonetas.' });
      if (!this.count('toilets')) issues.push({ level: 'error', msg: 'Faltan baños en el complejo.' });
      if (!this.count('entrance')) issues.push({ level: 'warn', msg: 'Sin taquilla de acceso no vendrán espectadores.' });
      else if (!this.count('parking')) issues.push({ level: 'warn', msg: 'Sin aparcamiento llegarán muy pocos espectadores.' });
      if (tr.entry && pads.length) {
        this.rebuildFields();
        const f = this.fields.get('r_entry_' + tr.id);
        const reach = f && pads.some(b => f.get(b.tx, b.tz) >= 0 || this.doorTiles(b, 'open').some(t => f.get(t.tx, t.tz) >= 0));
        if (!reach) issues.push({ level: 'error', msg: 'Los pilotos no pueden llegar desde el paddock hasta la entrada de pista.' });
      }
      tr.fullIssues = issues;
      return issues;
    }
    openTrack(tr) {
      const issues = this.validateTrack(tr);
      if (issues.some(i => i.level === 'error')) return { ok: false, reason: issues.find(i => i.level === 'error').msg, issues };
      if (!tr.stats) MX.TrackAnalyzer.analyze(tr, this.world, this);
      this.endTest(tr);
      tr.state = 'open';
      this._openCache = null;
      this.fieldsDirty = true;
      this.notify('¡' + tr.name + ' abre al público! Dificultad ' + U.fmt1(tr.stats.diff) + ', valoración ' + U.fmt1(tr.stats.rating) + '.', 'success');
      MX.Bus.emit('track:opened', { track: tr });
      return { ok: true };
    }
    closeTrack(tr) {
      if (this.race && this.race.trackId === tr.id) return { ok: false, reason: 'Hay una carrera en curso' };
      this.endTest(tr);
      tr.state = 'closed';
      this._openCache = null;
      for (const r of this.riders) if (r.trackId === tr.id && (r.state === 'ride' || r.state === 'wait' || r.state === 'toTrack')) {
        if (r.state === 'ride') r.leaveTrack(this, tr); else { r.state = 'rest'; r.timer = 4; }
      }
      this.fieldsDirty = true;
      MX.Bus.emit('track:closed', { track: tr });
      return { ok: true };
    }
    testTrack(tr) {
      const issues = tr.validate(this.world);
      if (issues.some(i => i.level === 'error')) return { ok: false, reason: issues.find(i => i.level === 'error').msg, issues };
      const st = MX.TrackAnalyzer.analyze(tr, this.world, this);
      tr.statsTested = true;
      tr.crashMarks = [];
      if (tr.state !== 'open') {
        tr.state = 'testing';
        /* three test riders of different levels ride two laps */
        const s0 = tr.startS != null ? tr.startS + 3 : 0;
        [26, 55, 86].forEach((sk, k) => {
          const rd = new A.Rider(this, this.rng, { skill: sk, bike: Cat.bikes[sk < 40 ? 1 : sk < 70 ? 2 : 4] });
          rd.name = ['Probador Novato', 'Probador Amateur', 'Probador Experto'][k];
          rd.test = tr.id; rd.cols = [[255, 255, 255], [40, 40, 40], [255, 106, 19], [255, 210, 40]];
          rd.joinTrack(this, tr, s0 - k * 6, (k - 1) * 1.6, 0.5);
          rd.lapsPlan = 2;
          this.riders.push(rd);
        });
      }
      MX.Bus.emit('track:tested', { track: tr, stats: st });
      return { ok: true, stats: st };
    }
    endTest(tr) {
      for (const r of this.riders) if (r.test === tr.id) r.dead = true;
      if (tr.state === 'testing') tr.state = 'closed';
    }
    deleteTrack(tr) {
      if (this.race && this.race.trackId === tr.id) return { ok: false, reason: 'Hay una carrera en curso' };
      this.closeTrack(tr);
      tr.clearOccupancy(this.world);
      /* a circuit that never opened is simply dismantled: everything paid comes back */
      const worth = tr.geometryCost() + tr.featureCost();
      const back = Math.round(tr.state === 'building' ? Math.min(tr.paid, worth) : worth * 0.35);
      this.econ.refund('construccion', back);
      this.tracks = this.tracks.filter(t => t !== tr);
      if (this.selectedTrack === tr) this.selectedTrack = null;
      this._openCache = null; this.fieldsDirty = true;
      MX.Bus.emit('track:list');
      return { ok: true, refund: back };
    }
    trackFit(rider, tr) {
      if (!tr.stats) return 0.5;
      const pref = U.clamp(rider.attr.skill / 10 + 0.6, 1.2, 9.5);
      const d = tr.stats.diff - pref;
      return U.clamp(1 - Math.abs(d) / (d > 0 ? 3 : 4.5), 0, 1) * (0.75 + tr.stats.rating / 40);
    }
    chooseTrack(rider, rng) {
      let best = null, bs = -1;
      for (const tr of this.openTracks()) {
        if (!tr.entry) continue;
        if (this.race && this.race.trackId === tr.id) continue;
        const crowd = this.ridersOn(tr) / Math.max(4, tr.stats ? tr.stats.capacity : 12);
        const s = this.trackFit(rider, tr) - crowd * 0.35 + rng.range(0, 0.15);
        if (s > bs) { bs = s; best = tr; }
      }
      return best;
    }
    ridersOn(tr) { let n = 0; for (const r of this.riders) if (r.trackId === tr.id && r.state === 'ride') n++; return n; }
    ridersOnTracks() { let n = 0; for (const r of this.riders) if (r.state === 'ride') n++; return n; }
    trackTraffic(tr, s, dist) {
      for (const r of this.riders) {
        if (r.state !== 'ride' || r.trackId !== tr.id || !r.m) continue;
        const d = U.mod(s - r.m.s, tr.length);
        if (d < dist || d > tr.length - 3) return true;
      }
      return false;
    }
    trackNeedingCare() {
      let best = null, bw = 0.06;
      for (const tr of this.tracks) {
        if (!tr.S || !tr.entry || tr.state === 'building') continue;
        if (this.race && this.race.trackId === tr.id) continue;
        if (this.staff.some(s => s.role === 'crew' && s.task && s.task.track === tr.id && s.state !== 'idle')) continue;
        const w = tr.avgWear();
        if (w > bw) { bw = w; best = tr; }
      }
      return best;
    }
    nearestTrackPoint(x, z) {
      let best = null, bd = Infinity;
      for (const tr of this.tracks) {
        if (!tr.S) continue;
        const r = tr.nearestS(x, z);
        if (r && r.dist < bd) { bd = r.dist; const i = r.i; best = { x: tr.S.x[i], z: tr.S.z[i], tr, d: r.dist }; }
      }
      return best;
    }

    /* ---------------- navigation fields ---------------- */
    riderPassable(tx, tz, i) {
      const w = this.world;
      if (w.owned[i] !== 1 && w.path[i] !== P.ROAD) return false;
      if (w.isWater(tx, tz)) return false;
      if (w.trackOcc[i]) return false;
      const b = w.bld[i];
      if (b >= 0) { const bb = this.buildings.get(b); if (!bb || !OPEN_AREA[bb.type]) return false; }
      if (w.tileSlope(tx, tz) > 3.5) return false;
      return true;
    }
    rebuildFields() {
      const w = this.world, N = w.N;
      this.fieldVer = (this.fieldVer || 0) + 1;
      const walk = (x, z, i) => { const p = w.path[i]; return p === P.GRAVEL || p === P.PAVED; };
      const rpass = (x, z, i) => this.riderPassable(x, z, i);
      const F = new Map();
      const srcPath = (types, filter) => {
        const out = [];
